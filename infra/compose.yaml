name: bazi-ai

# Add application/OCR services with their implementation and smoke tests.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bazi}
      POSTGRES_USER: ${POSTGRES_USER:-bazi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in ignored .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.8.3-alpine@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  corpus-inspect:
    profiles: [tools]
    image: bazi-ai-corpus:local
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: corpus
    init: true
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    volumes:
      - type: bind
        source: ${BOOKS_DIR:-../inputs/books}
        target: /inputs/books
        read_only: true
        bind:
          create_host_path: false
    command: ["python", "scripts/inspect_corpus.py", "/inputs/books"]

networks:
  internal: {internal: true}

# Preserve existing persistent volume names; never use down -v to update.
volumes:
  pgdata:
  objects:
  staging:
  model_cache:
