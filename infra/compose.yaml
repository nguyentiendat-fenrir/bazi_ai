name: bazi-ai

# Application services are added with their implementation and tests.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bazi}
      POSTGRES_USER: ${POSTGRES_USER:-bazi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in ignored .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.8.3-alpine@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  corpus-inspect:
    profiles: [tools]
    image: bazi-ai-corpus:local
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: corpus
    init: true
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    volumes:
      - type: bind
        source: ${BOOKS_DIR:-../inputs/books}
        target: /inputs/books
        read_only: true
        bind:
          create_host_path: false
    command: ["python", "scripts/inspect_corpus.py", "/inputs/books"]

  # Ingestion worker (all stages incl. OCR) and watchdog/dispatcher. Internal network
  # only: parsers and OCR never reach the Internet (docs/12). Needs POSTGRES_APP_USER.
  worker:
    profiles: [app]
    image: bazi-ai-app:local
    build: &app_build
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: app
    env_file: &app_env_file [../.env]
    environment: &app_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/objects
    depends_on: &app_deps
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    volumes:
      - objects:/data/objects
    networks: [internal]

  watchdog:
    profiles: [app]
    image: bazi-ai-app:local
    build: *app_build
    env_file: *app_env_file
    environment: *app_env
    depends_on: *app_deps
    command: ["python", "-m", "backend.app.ingestion.watchdog"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    networks: [internal]

networks:
  internal: {internal: true}

# Preserve existing persistent volume names; never use down -v to update.
volumes:
  pgdata:
  objects:
  staging:
  model_cache:
