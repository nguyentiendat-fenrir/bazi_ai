# Dev-only override: expose PostgreSQL and Redis on loopback for migrations,
# integration tests and worker smoke runs from the host. Never use on the Ubuntu runtime.
#   docker compose --env-file .env -f infra/compose.yaml -f infra/compose.dev.yaml up -d --wait postgres
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-55432}:5432"
    # The internal network cannot publish ports; add a host-reachable one.
    networks: [internal, devhost]

  redis:
    ports:
      - "127.0.0.1:${REDIS_DEV_PORT:-56379}:6379"
    networks: [internal, devhost]

networks:
  devhost: {}
