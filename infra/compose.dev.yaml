# Dev-only override: expose PostgreSQL on loopback for migrations and
# integration tests run from the host. Never use on the Ubuntu runtime.
#   docker compose --env-file .env -f infra/compose.yaml -f infra/compose.dev.yaml up -d --wait postgres
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-55432}:5432"
    # The internal network cannot publish ports; add a host-reachable one.
    networks: [internal, devhost]

networks:
  devhost: {}
