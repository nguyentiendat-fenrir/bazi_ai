[project]
name = "bazi-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "celery>=5.5,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.9,<3",
  "redis>=6,<8",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
corpus = [
    "pypdf>=6.21.0",
]
dev = [
    "pytest>=8,<10",
    "rarfile==4.2",
]

[tool.uv]
package = false
